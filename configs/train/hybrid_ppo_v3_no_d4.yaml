# s--- Run & Path Settings ---
project_name: "2048-ppo-training"
run_name: "hybrid_ppo_v3_no_d4"
output_dir: "data/pre_freeze_200m" # Target outputs; preserves the diagnostic pilot

# --- Resume Settings ---
load_model: false
checkpoint_path: null # Target v3 runs must not reuse archived checkpoints

# --- Training Parameters ---
total_timesteps: 200_000_000
n_envs: 128
save_interval: 5_000_000
seed: 0
training_seeds: [0, 1, 2, 3]

# --- PPO Hyperparameters---
ppo_params:
  n_steps: 512
  gamma: 0.9500241783796721
  ent_coef: 0.000006683561172757891
  learning_rate:
    type: "linear_decay"
    initial_value: 0.0002506795165161916
  clip_range: 0.2
  batch_size: 4096
  n_epochs: 4

# --- Agent Architecture ---
features_dim: 256

# export OMP_NUM_THREADS=1
# export MKL_NUM_THREADS=1

env_kwargs:
  d4_augment: false

experiment_definition:
  name: "v3"
  policy_class: "twenty_forty_eight_ai.agent.policy.ValueNormalizedMaskablePolicy"
  ppo_class: "twenty_forty_eight_ai.agent.ppo.ValueHeadLRMaskablePPO"
  value_head_lr_multiplier: 10.0
