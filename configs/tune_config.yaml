# Configuration for an Optuna hyperparameter tuning study

# --- Study Settings ---
study_name: "ACL_run_with_New_Arch_and_Reward"
db_path: "data/studies.db" # A single database file for all studies
n_trials: 100
timeout_hours: 20

# --- Pruner Settings ---
pruner:
  type: "MedianPruner"
  n_startup_trials: 5
  n_warmup_steps: 500000

# --- Trial Settings ---
trial:
  total_timesteps: 5000000
  n_envs: 16
  report_freq: 100000

# --- PPO Hyperparameter Search Space ---
ppo_search_space:
  n_steps: { type: "categorical", choices: [512, 1024, 2048] }
  gamma: { type: "float", low: 0.95, high: 0.999, log: true }
  ent_coef: { type: "float", low: 1e-6, high: 1e-4, log: true }
  learning_rate: { type: "float", low: 1e-5, high: 1e-3, log: true }
  clip_range: { type: "categorical", choices: [0.1, 0.2, 0.3] }