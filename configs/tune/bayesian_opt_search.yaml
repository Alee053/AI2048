# Configuration for an Optuna hyperparameter tuning study

# --- Study Settings ---
project_name: "2048-ppo-tuning"
study_name: "hybrid_ppo_search"
db_path: "data/studies.db" # A single database file for all studies
timeout_hours: 12

# --- Pruner Settings ---
pruner:
  type: "MedianPruner"
  n_startup_trials: 5
  n_warmup_steps: 500_000

# --- Trial Settings ---
trial:
  total_timesteps: 5_000_000
  n_envs: 16
  report_freq: 250_000

# --- PPO Hyperparameter Search Space ---
ppo_search_space:
  n_steps: { type: "categorical", choices: [512, 1024, 2048] }
  gamma: { type: "float", low: 0.95, high: 0.999, log: true }
  ent_coef: {  type: "float", low: 0.000001, high: 0.0001, log: true  }
  learning_rate: { type: "float", low: 0.00001, high: 0.001, log: true }
  clip_range: { type: "categorical", choices: [0.1, 0.2, 0.3] }